<title>GROUND — give your brain another job</title>
<style>

*{box-sizing:border-box}

.target.done{opacity:.12;pointer-events:none;transform:translate(-50%,-50%) scale(.7)}
.target.active{background:var(--blue);color:white}
.tapHint{position:absolute;left:14px;bottom:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:800;text-transform:uppercase;background:var(--paper);border:2px solid var(--ink);padding:6px 8px}
.scribbleShell{width:min(760px,92%);display:grid;gap:10px;padding:18px}

#scribbleCanvas{width:100%;height:290px;background:var(--white);border:3px solid var(--ink);touch-action:none;cursor:crosshair;display:block}

.toneIcon.playing{animation:pulse .34s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.08);background:var(--orange)}}
.choiceRow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.choice{border:2px solid var(--ink);background:var(--paper);min-width:56px;padding:12px 14px;font-size:20px;font-weight:900}.choice:hover{background:var(--blue);color:white;border-color:var(--blue)}
.senseStage{display:grid;grid-template-columns:1fr .85fr;width:100%;height:100%;min-height:390px}.senseWord{display:grid;place-items:center;padding:25px;background:var(--blue);color:white;font-size:clamp(48px,8vw,110px);line-height:.8;letter-spacing:-.07em;font-weight:950;text-transform:uppercase;text-align:center}.senseAction{padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}.senseAction p{font-size:24px;font-weight:800;line-height:1.12}.foundBtn{background:var(--ink);color:var(--paper);padding:16px;text-transform:uppercase;font-weight:950;text-align:left}.foundBtn:hover{background:var(--orange);color:var(--ink)}
.endGrid{display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:end}.endChoices{border-left:2px solid var(--ink);padding-left:18px;display:grid;gap:8px}.endChoices button{border:2px solid var(--ink);padding:14px;text-align:left;text-transform:uppercase;font-weight:900;background:transparent}.endChoices button:hover{background:var(--blue);color:white;border-color:var(--blue)}
.endChoices button.primaryChoice{background:var(--ink);color:var(--paper)}
.outcome{display:inline-block;background:var(--yellow);border:2px solid var(--ink);padding:7px 9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:800;margin-bottom:13px;text-transform:uppercase}
.chatPanel{max-width:900px;margin:auto;border:2px solid var(--ink);background:var(--white);box-shadow:8px 8px 0 var(--blue);display:grid;grid-template-rows:auto minmax(320px,52svh) auto}
.chatHead{padding:16px 18px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:12px}.chatHead strong{font-size:20px;text-transform:uppercase}.chatHead small{display:block;color:var(--muted);margin-top:3px}.chatClose{border:2px solid var(--ink);padding:8px 10px;font-weight:900;text-transform:uppercase}
.chatLog{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}.msg{max-width:78%;padding:12px 14px;border:2px solid var(--ink);font-size:16px;line-height:1.35;white-space:pre-wrap}.msg.user{align-self:flex-end;background:var(--ink);color:var(--paper)}.msg.bot{align-self:flex-start;background:var(--paper)}.msg.meta{border:0;padding:0;background:none;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.chatComposer{border-top:2px solid var(--ink);padding:12px;display:grid;grid-template-columns:1fr auto;gap:8px}.chatComposer textarea{resize:none;min-height:54px;max-height:140px;border:2px solid var(--ink);background:var(--white);padding:12px;font:inherit}.chatSend{background:var(--blue);color:white;border:2px solid var(--blue);padding:0 18px;font-weight:950;text-transform:uppercase}.chatSend:disabled{opacity:.5;cursor:default}.chatActions{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 14px}.chatActions button{border:2px solid var(--ink);padding:9px 11px;font-weight:900;text-transform:uppercase;background:var(--paper)}.chatActions button:hover{background:var(--ink);color:var(--paper)}
@media(max-width:760px){.chatPanel{box-shadow:none}.chatLog{padding:12px}.msg{max-width:90%}.chatComposer{grid-template-columns:1fr}.chatSend{min-height:48px}}
.sharePanel,.settingsPanel,.aboutPanel,.urgentPanel{max-width:820px;border:2px solid var(--ink);background:var(--white);padding:22px;box-shadow:8px 8px 0 var(--blue)}
.sharePanel h2,.settingsPanel h2,.aboutPanel h2,.urgentPanel h2{font-size:clamp(38px,6vw,70px)}
.panelCopy{font-size:20px;line-height:1.3;max-width:650px;margin:16px 0 24px}.panelActions{display:flex;flex-wrap:wrap;gap:9px}.panelActions button{border:2px solid var(--ink);padding:13px 15px;text-transform:uppercase;font-weight:900}.panelActions button.main{background:var(--blue);color:white;border-color:var(--blue)}
.settingRow{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;border-top:2px solid var(--ink);padding:14px 0}.settingRow:last-of-type{border-bottom:2px solid var(--ink)}.settingRow strong{display:block;font-size:18px;text-transform:uppercase}.settingRow small{display:block;color:var(--muted);margin-top:3px;line-height:1.35}.switch{border:2px solid var(--ink);padding:8px 10px;min-width:78px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:900;text-transform:uppercase}.switch.on{background:var(--ink);color:var(--paper)}
footer{border-top:2px solid var(--line);padding-top:9px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.footerLink{text-decoration:underline;text-underline-offset:3px}.footerLink:hover{color:var(--blue)}
.hidden{display:none!important}

  .app{padding:14px 14px 12px}.gridHero,.endGrid{grid-template-columns:1fr;gap:22px}.heroSide,.endChoices{border-left:0;border-top:2px solid var(--ink);padding-left:0;padding-top:14px}.taskWrap{grid-template-columns:54px 1fr;gap:12px}.taskRail{padding-right:8px}.counter b{font-size:30px}.progressRail{height:155px;width:7px}.taskStage{min-height:390px}.tapStage{min-height:390px}.senseStage{grid-template-columns:1fr}.senseWord{min-height:220px}.answerBar{flex-direction:column}.answerBtn{width:100%}.target{width:58px;height:58px;font-size:24px}.heroSide p{max-width:none}footer{align-items:flex-end}.footerHideMobile{display:none}}

<body>
<div class="app">
<header>
  <button class="logo" onclick="home()" aria-label="GROUND home">GR<span class="logoMark" aria-hidden="true"></span>UND</button>
  <div class="headerTools">
    <button class="utility" onclick="openChat()">CHAT</button>
    <button id="soundButton" class="utility" onclick="toggleSound()" aria-pressed="false">SOUND 0</button>
    <button id="themeButton" class="utility" onclick="cycleTheme()">THEME</button>
    <button class="utility" onclick="settings()">•••</button>
  </div>
</header>
<main id="main"></main>
<footer>
  <span class="footerHideMobile">NO ACCOUNT · NO STORY REQUIRED · LOCAL SETTINGS ONLY</span>
  <button class="footerLink" onclick="urgent()">urgent help</button>
</footer>
</div>
<script>
const main=document.getElementById('main');
const STORE='ground_profile_v3';
const defaults={sound:false,haptics:false,noMath:false,theme:'paper',customTheme:{paper:'#f1eedf',ink:'#111111',blue:'#2146ff',orange:'#ff5a36',yellow:'#f1d54b'},sessions:0,completed:0,usedTaskIds:[],outcomes:{quieter:0,same:0,louder:0},perf:{numbers:{n:0,ok:0,rt:0},words:{n:0,ok:0,rt:0},memory:{n:0,ok:0,rt:0},tones:{n:0,ok:0,rt:0}},helped:{visual:0,cognitive:0,motor:0,audio:0,sensory:0}};
let profile=loadProfile();
let state=freshState();
const WORDS=['planet','orange','window','garden','silver','camera','rabbit','pencil','ocean','yellow','basket','forest','violet','coffee','mirror','blanket','ticket','pocket','lantern','velvet','magnet','pepper','castle','rocket','button','marble','winter','copper','jungle','bridge','signal','paper','shadow','island','anchor','bottle','cloud','fabric','lemon','river'];
const SENSES=[
  {big:'FIND BLUE',copy:'Look away from the screen. Find one blue thing in the room.'},
  {big:'TOUCH COLD',copy:'Find something cooler than your hand. Touch it for three seconds.'},
  {big:'FIND 3 EDGES',copy:'Look around. Find three straight edges. Point at each one.'},
  {big:'FEEL WEIGHT',copy:'Notice where your body is supported by the chair, floor, bed, or wall.'},
  {big:'HEAR 2 THINGS',copy:'Stop. Listen past the nearest sound. Notice two separate sounds.'},
  {big:'FIND ROUND',copy:'Find one circular or curved object. Trace its edge with your eyes.'},
  {big:'TOUCH TEXTURE',copy:'Touch something with a clear texture. Notice three details about how it feels.'},
  {big:'FIND RED',copy:'Look away from the screen. Find one red or warm-coloured thing.'},
  {big:'FEEL YOUR FEET',copy:'Press both feet down for three seconds and notice the pressure.'},
  {big:'NOTICE LIGHT',copy:'Find the brightest area in the room, then the darkest.'}
];

function buildTaskBank(){
  const bank=[];
  const add=t=>bank.push({...t,id:'task-'+String(bank.length+1).padStart(3,'0')});

  // 40 varied visual/tap tasks
  const visualModes=[
    {kind:'asc',label:'tap low → high'},
    {kind:'desc',label:'tap high → low'},
    {kind:'letters',label:'tap A → B → C → D'},
    {kind:'lettersRev',label:'tap D → C → B → A'},
    {kind:'odds',label:'tap odd numbers low → high'}
  ];
  for(let i=0;i<40;i++) add({type:'visual',variant:i,mode:visualModes[i%visualModes.length]});

  // 40 arithmetic tasks, pre-generated and unique
  for(let i=0;i<40;i++){
    const a=11+i,b=3+(i%13),minus=i%3===0;
    add({type:'numbers',a, b, minus});
  }

  // 30 word-reversal tasks
  for(let i=0;i<30;i++) add({type:'words',word:WORDS[i%WORDS.length]});

  // 30 memory-reversal tasks with deterministic unique sequences
  for(let i=0;i<30;i++){
    const len=4+(i%2),arr=[];
    for(let j=0;j<len;j++)arr.push(((i*3+j*2)%9)+1);
    add({type:'memory',arr});
  }

  // 30 motor tasks with varied instructions/thresholds
  const motorPrompts=[
    'FILL THE BOX.\nDON\'T DRAW ANYTHING.',
    'SCRIBBLE FAST.\nKEEP MOVING.',
    'COVER THE CORNERS.\nNO SHAPE NEEDED.',
    'MAKE LOOPS.\nDO NOT LIFT YOUR FINGER.',
    'MOVE LEFT + RIGHT.\nKEEP IT MESSY.'
  ];
  for(let i=0;i<30;i++) add({type:'motor',prompt:motorPrompts[i%motorPrompts.length],threshold:82+(i%19)});

  // 30 real-world sensory tasks
  for(let i=0;i<30;i++) add({type:'sensory',sense:SENSES[i%SENSES.length],variant:i});

  return bank; // exactly 200
}
const TASK_BANK=buildTaskBank();
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function eligibleTask(t){
  if(profile.noMath&&t.type==='numbers')return false;
  return true;
}
function unseenTasks(){const used=new Set(profile.usedTaskIds||[]);return TASK_BANK.filter(t=>eligibleTask(t)&&!used.has(t.id))}
function drawTask(){
  let pool=unseenTasks();
  if(!pool.length){
    // Bank exhausted for the current preference set: begin a fresh cycle only then.
    profile.usedTaskIds=[];
    pool=TASK_BANK.filter(eligibleTask);
  }
  const task=pool[rand(0,pool.length-1)];
  profile.usedTaskIds.push(task.id);
  save();
  return task;
}

const customPanel=`<div class="customThemePanel"><div class="rgbWheelWrap"><canvas id="rgbWheel" class="rgbWheel" width="300" height="300" aria-label="RGB colour wheel"></canvas><input id="brightness" class="brightness" type="range" min="5" max="100" value="100" aria-label="Colour brightness"></div><div class="colorReadout"><div class="colorRoleRow">${[['paper','BACKGROUND'],['ink','TEXT'],['blue','PRIMARY'],['orange','WARM'],['yellow','HIGHLIGHT']].map(([id,label])=>`<button class="colorRole ${customRole===id?'active':''}" onclick="selectCustomRole('${id}')">${label}</button>`).join('')}</div><span id="colorDot" class="colorDot"></span><strong id="colorHex"></strong><small>Drag anywhere on the colour sphere. Move outward for more saturation; use the slider for brightness. Changes apply instantly across GROUND.</small><button class="customReset" onclick="resetCustomTheme()">RESET CUSTOM</button></div></div>`;
render(`<div class="settingsPanel"><div class="kicker"><b>settings</b></div><h2>MAKE IT FIT<br>YOUR BRAIN.</h2><div class="settingRow"><div><strong>Colour theme</strong><small>Choose a preset or build your own palette.</small>${themeButtons}${profile.theme==='custom'?customPanel:''}</div></div><div class="settingRow"><div><strong>Sound</strong><small>Spoken prompts plus the listening task.</small></div><button class="switch ${profile.sound?'on':''}" onclick="profile.sound=!profile.sound;save();settings()">${profile.sound?'ON':'OFF'}</button></div><div class="settingRow"><div><strong>No maths</strong><small>Use words and memory instead of arithmetic.</small></div><button class="switch ${profile.noMath?'on':''}" onclick="profile.noMath=!profile.noMath;save();settings()">${profile.noMath?'ON':'OFF'}</button></div><div class="settingRow"><div><strong>Haptics</strong><small>Small vibration cues where the device supports them.</small></div><button class="switch ${profile.haptics?'on':''}" onclick="profile.haptics=!profile.haptics;save();haptic([10,20,10]);settings()">${profile.haptics?'ON':'OFF'}</button></div><div class="settingRow"><div><strong>Local profile</strong><small>${profile.completed} completed reset${profile.completed===1?'':'s'}. Settings and simple performance data stay in this browser.</small></div><button class="switch" onclick="eraseLocal()">ERASE</button></div><div class="panelActions" style="margin-top:20px"><button class="main" onclick="home()">DONE</button><button onclick="about()">WHY THIS WORKS</button></div></div>`);if(profile.theme==='custom')setTimeout(setupRgbWheel,0)}
function eraseLocal(){try{localStorage.removeItem(STORE)}catch{}profile=clone(defaults);applyTheme();settings()}
function about(){render(`<div class="aboutPanel"><div class="kicker"><b>why this exists</b></div><h2>DON'T ARGUE WITH<br>THE LOOP.<br>COMPETE WITH IT.</h2><p class="panelCopy">GROUND gives attention a neutral job for a short burst, then points it back toward the room. The tasks rotate between thinking, looking, moving, listening, and sensing so the experience is not dependent on one technique.</p><p class="panelCopy">It is a grounding tool, not medical treatment. The optional chat is designed to validate feelings without automatically validating frightening conclusions, then offer one practical next move. No account is required.</p><div class="panelActions"><button class="main" onclick="start(false)">TRY 60 SEC</button><button onclick="shareGround()">SEND GROUND TO SOMEONE</button><button onclick="settings()">BACK</button></div></div>`)}
function urgent(){render(`<div class="urgentPanel"><div class="kicker"><b>urgent help</b></div><h2>DON'T USE THIS<br>AS A SAFETY PLAN.</h2><p class="panelCopy">If you may act on thoughts of harming yourself or someone else, have taken an overdose, are badly injured, or cannot keep yourself safe, contact local emergency or crisis services now and move toward another person rather than staying alone.</p><div class="panelActions"><button class="main" onclick="human()">HELP ME CONTACT SOMEONE</button><button onclick="home()">BACK</button></div></div>`)}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
window.addEventListener('keydown',e=>{if(e.key==='Escape')home()});
applyTheme();
if(location.hash==='#now')start(true);else home();
</script>
</body>
</html>
