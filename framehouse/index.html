<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Framehouse — Film OS</title>
<style>
:root{--bg:#f4f2ec;--ink:#111;--muted:#777;--line:#d6d2c8;--panel:#fffdf8;--black:#0d0d0d;--accent:#d9b8ff;--sans:Arial,Helvetica,sans-serif;--serif:Georgia,'Times New Roman',serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #111;outline-offset:2px}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#0d0d0d;color:#fff;padding:28px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{font:34px/.8 var(--serif);letter-spacing:-.04em;margin-bottom:10px}.tag{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#8f8f8f;margin-bottom:48px}.nav{display:grid;gap:5px}.nav button{background:none;color:#999;text-align:left;border:0;padding:11px 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-left:1px solid transparent}.nav button.active,.nav button:hover{color:#fff;border-left-color:#fff}.sideBottom{margin-top:auto;border-top:1px solid #292929;padding-top:16px}.profile{display:flex;align-items:center;gap:9px;font-size:10px;color:#aaa}.avatar{width:28px;height:28px;border:1px solid #555;border-radius:50%;display:grid;place-items:center;color:#fff}.main{padding:28px 34px 50px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.title{font:clamp(46px,6vw,88px)/.82 var(--serif);letter-spacing:-.04em;margin:0}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid #bbb8ae;background:transparent;padding:11px 14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.btn.primary{background:#111;color:#fff;border-color:#111}.btn:hover{transform:translateY(-1px)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{background:var(--panel);border:1px solid var(--line);padding:17px;min-height:105px}.metric b{display:block;font:38px/.9 var(--serif);margin:8px 0}.section{margin-top:28px}.sectionHead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:10px}.sectionHead h2{font:28px/.9 var(--serif);margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);padding:18px;text-align:left;min-height:190px;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#888}.cardTop{display:flex;justify-content:space-between;gap:10px}.status{font-size:8px;letter-spacing:.12em;text-transform:uppercase;padding:5px 7px;background:#e8e4da}.card h3{font:30px/.9 var(--serif);margin:30px 0 8px}.meta{font-size:10px;color:var(--muted);line-height:1.5}.bar{height:3px;background:#e2ded5;margin-top:18px}.bar i{display:block;height:100%;background:#111}.empty{border:1px dashed #bbb8ae;padding:48px;text-align:center;background:#f8f6f0}.empty h3{font:34px var(--serif);margin:0 0 10px}.empty p{color:var(--muted);font-size:11px}.rows{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr 120px 100px 100px;gap:15px;align-items:center;padding:15px 5px;border-bottom:1px solid var(--line);font-size:11px}.row strong{font-weight:normal}.row small{color:var(--muted)}.search{border:1px solid var(--line);background:var(--panel);padding:11px 12px;width:230px;font-size:11px}.modalbg{position:fixed;inset:0;background:#0008;z-index:50;display:grid;place-items:center;padding:20px}.modal{background:var(--panel);width:min(620px,100%);padding:28px;border:1px solid #222;box-shadow:0 25px 80px #0004}.modal h2{font:40px/.9 var(--serif);margin:0 0 20px}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.field input,.field select{border:1px solid var(--line);background:#fff;padding:11px}.formActions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.hidden{display:none!important}.detail{width:min(900px,100%);max-height:90vh;overflow:auto}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.detailbox{border:1px solid var(--line);padding:14px}.detailbox span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:7px}.detailbox b{font:24px var(--serif)}.detailactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:12px 15px;font-size:10px;letter-spacing:.06em;z-index:100;box-shadow:0 10px 30px #0003}.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}.task input{accent-color:#111}.userline{font-size:10px;color:var(--muted);margin-top:7px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{grid-template-columns:repeat(3,1fr)}.sideBottom{display:none}.main{padding:22px 18px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.nav{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr}.top{display:block}.actions{margin-top:15px;flex-wrap:wrap}.search{width:100%}.detailgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">Framehouse</div><div class="tag">Film OS / production control</div><nav class="nav"><button class="active" data-view="dashboard">Dashboard</button><button data-view="projects">Projects</button><button data-view="schedule">Schedule</button><button data-view="people">People</button><button data-view="budget">Budget</button><button data-view="documents">Documents</button></nav><div class="sideBottom"><div class="profile"><div class="avatar" id="avatar">FH</div><div><div id="profileName">Guest</div><div id="profileStatus">Local workspace</div></div></div></div></aside>
<main class="main"><div id="root"></div></main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='framehouse_projects_v2',USER='framehouse_user_v1';let projects=JSON.parse(localStorage.getItem(KEY)||'[]');let user=JSON.parse(localStorage.getItem(USER)||'null');let currentView='dashboard';let activeId=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(projects))}function toast(t){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>r.innerHTML='',2200)}
function applyUser(){document.getElementById('profileName').textContent=user?.name||'Guest';document.getElementById('profileStatus').textContent=user?'Signed in':'Local workspace';document.getElementById('avatar').textContent=(user?.name||'FH').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function showView(v){currentView=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function render(){applyUser();const r=document.getElementById('root');if(currentView==='dashboard')r.innerHTML=dashboard();if(currentView==='projects')r.innerHTML=projectsView();if(currentView==='schedule')r.innerHTML=scheduleView();if(currentView==='people')r.innerHTML=simpleView('People','Crew, collaborators and contacts','Add people when you start staffing a production.');if(currentView==='budget')r.innerHTML=simpleView('Budget','Production spend at a glance','Create a project to begin tracking budgets.');if(currentView==='documents')r.innerHTML=simpleView('Documents','Scripts, decks, references and paperwork','Your production files will live here.');bindView();}
function head(label,title,extra=''){return '<div class="top"><div><div class="eyebrow">'+label+'</div><h1 class="title">'+title+'</h1></div><div class="actions">'+extra+'</div></div>'}
function dashboard(){const active=projects.filter(p=>p.status!=='Complete').length;const tasks=projects.reduce((n,p)=>n+(p.tasks||[]).filter(t=>!t.done).length,0);return head('Control room','Good evening.', '<button class="btn primary" onclick="openModal()">+ New project</button>')+'<div class="userline">'+(user?'Synced to your account':'You are working locally. Sign in to sync projects.')+'</div><div class="grid"><div class="metric"><div class="eyebrow">Projects</div><b>'+projects.length+'</b><span class="meta">Total productions</span></div><div class="metric"><div class="eyebrow">Active</div><b>'+active+'</b><span class="meta">In motion</span></div><div class="metric"><div class="eyebrow">Open tasks</div><b>'+tasks+'</b><span class="meta">Across all projects</span></div><div class="metric"><div class="eyebrow">Budget</div><b>₹'+projects.reduce((n,p)=>n+(+p.budget||0),0).toLocaleString('en-IN')+'</b><span class="meta">Planned total</span></div></div><div class="section"><div class="sectionHead"><h2>Current slate</h2><button class="btn" onclick="showView('projects')">View all</button></div>'+(projects.length?'<div class="cards">'+projects.slice(0,6).map(card).join('')+'</div>':'<div class="empty"><h3>Start from zero.</h3><p>No projects have been added yet. Build your first production workspace.</p><button class="btn primary" onclick="openModal()">Create first project</button></div>')+'</div>'}
function card(p){return '<button class="card" onclick="openCard(\''+p.id+'\')"><div class="cardTop"><span class="eyebrow">'+esc(p.type||'Production')+'</span><span class="status">'+esc(p.status||'Development')+'</span></div><h3>'+esc(p.title)+'</h3><div class="meta">'+esc(p.location||'Location TBD')+' · '+esc(p.due||'Target TBD')+'</div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,+p.progress||0))+'%"></i></div><div class="meta" style="margin-top:7px">'+(+p.progress||0)+'% complete</div></button>'}
function projectsView(){return head('Production slate','Projects','<input id="search" class="search" placeholder="Search projects…"><button class="btn primary" onclick="openModal()">+ New project</button>')+'<div class="section">'+(projects.length?'<div id="projectRows" class="rows">'+projects.map(p=>'<div class="row"><strong>'+esc(p.title)+'</strong><small>'+esc(p.type||'Production')+'</small><small>'+esc(p.status||'Development')+'</small><button class="btn" onclick="openCard(\''+p.id+'\')">Open ↗</button></div>').join('')+'</div>':'<div class="empty"><h3>No projects yet.</h3><p>Create a project and Framehouse will build the workspace around it.</p></div>')+'</div>'}
function scheduleView(){return head('Calendar','Schedule','<button class="btn primary" onclick="openModal()">+ New project</button>')+'<div class="section"><div class="empty"><h3>Nothing scheduled.</h3><p>Project targets and production milestones will appear here.</p></div></div>'}
function simpleView(t,e,d){return head(e,t,'<button class="btn primary" onclick="openModal()">+ New project</button>')+'<div class="section"><div class="empty"><h3>'+d+'</h3><p>Framehouse keeps this area intentionally clean until you have a production to manage.</p></div></div>'}
function bindView(){const s=document.getElementById('search');if(s)s.oninput=()=>{const q=s.value.toLowerCase();document.querySelectorAll('#projectRows .row').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'grid':'none')};}
function openModal(){document.getElementById('modalRoot').innerHTML='<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="eyebrow">New production</div><h2>Build a project.</h2><form class="form" id="newProject"><div class="field"><label>Project title</label><input name="title" required placeholder="Untitled Film"></div><div class="field"><label>Format</label><select name="type"><option>Feature Film</option><option>Short Film</option><option>Commercial</option><option>Music Video</option><option>Series</option></select></div><div class="field"><label>Budget (₹)</label><input name="budget" type="number" min="0" placeholder="0"></div><div class="field"><label>Location</label><input name="location" placeholder="Mumbai, India"></div><div class="field"><label>Target date</label><input name="due" type="date"></div><div class="formActions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create project</button></div></form></div></div>';document.getElementById('newProject').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const p={id:crypto.randomUUID(),title:f.get('title'),type:f.get('type'),budget:+f.get('budget')||0,location:f.get('location')||'Location TBD',due:f.get('due')||'Target TBD',status:'Development',progress:0,tasks:[],crew:[],next_task:''};projects.unshift(p);save();closeModal();showView('projects');toast('Project created')};}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openCard(id){activeId=id;const p=projects.find(x=>x.id===id);if(!p)return toast('Project not found');document.getElementById('modalRoot').innerHTML='<div class="modalbg" onclick="if(event.target===this)closeDetail()"><div class="modal detail"><div class="eyebrow">'+esc(p.type)+'</div><h2>'+esc(p.title)+'</h2><div class="meta">'+esc(p.location)+' · '+esc(p.status)+'</div><div class="detailgrid"><div class="detailbox"><span>Progress</span><b>'+(+p.progress||0)+'%</b></div><div class="detailbox"><span>Budget</span><b>₹'+(+p.budget||0).toLocaleString('en-IN')+'</b></div><div class="detailbox"><span>Target</span><b>'+esc(p.due)+'</b></div></div><div class="field"><label>Next task</label><input id="detailTask" value="'+esc(p.next_task||'')+'" placeholder="What needs to happen next?"></div><div class="detailactions"><button class="btn" onclick="closeDetail()">Close</button><button class="btn primary" onclick="saveDetail()">Save changes</button></div></div></div>'}
function closeDetail(){document.getElementById('modalRoot').innerHTML='';activeId=null}function saveDetail(){const p=projects.find(x=>x.id===activeId);if(!p)return; p.next_task=document.getElementById('detailTask').value;save();closeDetail();render();toast('Project saved')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.view));render();
</script>
<script type="module">
const SUPABASE_URL='https://yhdhoqtibqqrocsbvoth.supabase.co';const SUPABASE_KEY='sb_publishable_7rqGyn_z2UqkS6Vzk0s7YA_52Ldru-i';
try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');const sb=createClient(SUPABASE_URL,SUPABASE_KEY);window.framehouseSupabase=sb;const {data:{session}}=await sb.auth.getSession();if(session?.user){window.framehouseSession=session;localStorage.setItem(USER,JSON.stringify({name:session.user.user_metadata?.full_name||session.user.email||'User',email:session.user.email}));user=JSON.parse(localStorage.getItem(USER));render();}
}catch(e){console.warn('Supabase unavailable; local mode remains active.',e)}
</script>
</body></html>
