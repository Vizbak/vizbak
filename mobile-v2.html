<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIZBAK</title>
<style>
:root{--bg:#050505;--fg:#f3f0e8;--gold:#b9924a;--line:rgba(185,146,74,.62);--muted:#9b968b;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100svh;overflow-x:hidden}button,a{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}button{border:0;background:none}.screen{min-height:100svh}
#home{position:fixed;inset:0;display:grid;place-items:center;background:#050505;z-index:20;transition:opacity .6s var(--ease),transform .8s var(--ease)}#home.hide{opacity:0;pointer-events:none;transform:scale(1.04)}#home h1{font-size:18vw;letter-spacing:.09em;margin:0;font-weight:800}.enter{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-size:8px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
#site{display:none;opacity:0;transition:opacity .7s var(--ease)}#site.show{display:block;opacity:1}.header{position:sticky;top:0;z-index:10;background:rgba(5,5,5,.92);backdrop-filter:blur(14px);padding:max(16px,env(safe-area-inset-top)) 16px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(185,146,74,.25)}.brand{font-weight:800;letter-spacing:.18em;font-size:14px}.cart{font-size:8px;letter-spacing:.2em;color:var(--muted)}
.hero{padding:24px 16px 20px;text-align:center}.heroLogo{font-size:22vw;font-weight:900;letter-spacing:.08em;margin:0;line-height:.8}.heroSub{margin-top:18px;color:var(--muted);font-size:7px;letter-spacing:.25em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.tile{position:relative;aspect-ratio:1/1.05;border:1px solid var(--line);overflow:hidden;background:#0b0b0b;text-align:left;padding:0}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.48) saturate(.7);transition:transform .7s var(--ease),filter .5s}.tile:active img{transform:scale(1.06);filter:brightness(.7) saturate(.85)}.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.78))}.tileText{position:absolute;z-index:2;inset:auto 12px 13px}.tileText b{display:block;font-size:18px;letter-spacing:.1em}.tileText small{display:block;margin-top:5px;color:#d2c6aa;font-size:6px;letter-spacing:.18em;text-transform:uppercase}.tileNo{position:absolute;z-index:2;top:10px;left:11px;color:#d2c6aa;font-size:6px;letter-spacing:.2em}
.work img{content:url('assets/work.svg')}.art img{content:url('assets/artworks/01-canvas.jpg')}.food img{content:url('assets/food/01-freshen-up.jpg')}.thoughts img{content:url('assets/artworks/04-textile.jpg')}.about img{content:url('assets/now.svg')}.now img{content:url('assets/03-vizbak-canvas.jpg')}
#panel{display:none;position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding-bottom:40px}#panel.open{display:block}.panelTop{position:sticky;top:0;z-index:5;background:rgba(5,5,5,.94);backdrop-filter:blur(14px);padding:max(14px,env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(185,146,74,.3);font-size:7px;letter-spacing:.22em;color:var(--gold)}.panelBody{padding:0 16px 40px}.panelBody h1{font-size:18vw;line-height:.8;margin:28px 0 16px;letter-spacing:.02em}.lead{font-family:Georgia,serif;font-size:25px;line-height:1.03;padding-bottom:20px;border-bottom:1px solid rgba(185,146,74,.35)}.label{margin:16px 0 10px;color:var(--gold);font-size:7px;letter-spacing:.22em;text-transform:uppercase}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gallery figure{margin:0;border:1px solid rgba(185,146,74,.5);background:#0a0a0a}.gallery img{display:block;width:100%;height:auto}.gallery figcaption{padding:8px;color:#bdb7aa;font-size:6px;letter-spacing:.1em}.contact{margin-top:22px;border-top:1px solid rgba(185,146,74,.35)}.contact a{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid rgba(185,146,74,.25);text-decoration:none}.contact span:first-child{font-size:7px;color:var(--gold);letter-spacing:.2em}.contact span:last-child{font-size:9px}
.neurons{position:relative;height:58vh;min-height:420px;margin-top:10px;border:1px solid rgba(185,146,74,.25);overflow:hidden}.neurons svg{position:absolute;inset:0;width:100%;height:100%}.node{position:absolute;transform:translate(-50%,-50%);font-size:8px;letter-spacing:.14em;color:#bdb7aa;text-transform:uppercase;padding:5px 7px;border:1px solid transparent}.node.active{color:#050505;background:var(--gold);border-color:var(--gold)}.node.center{font-size:12px;color:var(--gold);border-color:rgba(185,146,74,.55)}
.penrose{position:fixed;right:18px;bottom:18px;width:30px;height:30px;z-index:50;pointer-events:none;filter:drop-shadow(0 3px 6px rgba(185,146,74,.3))}.penrose span{position:absolute;width:20px;height:7px;background:var(--gold);left:5px;top:11px;transform-origin:center;border-radius:1px}.penrose span:nth-child(1){transform:rotate(30deg) translateY(-6px)}.penrose span:nth-child(2){transform:rotate(150deg) translateY(-6px)}.penrose span:nth-child(3){transform:rotate(270deg) translateY(-6px)}.penrose.spin{animation:spin .65s var(--ease)}@keyframes spin{0%{transform:rotate(0) scale(1)}45%{transform:rotate(145deg) scale(1.18)}100%{transform:rotate(360deg) scale(1)}}
footer{text-align:center;color:#777;font-size:6px;letter-spacing:.2em;padding:25px 0 30px}
</style></head>
<body>
<section id="home"><button id="enter"><h1>VIZBAK</h1></button><div class="enter">tap to enter</div></section>
<main id="site">
<header class="header"><div class="brand">VIZBAK</div><div class="cart">CART (0)</div></header>
<section class="hero"><h1 class="heroLogo">VIZBAK</h1><div class="heroSub">select a category</div></section>
<section class="grid">
<button class="tile work" data-page="work"><img><span class="tileNo">01</span><span class="tileText"><b>WORK</b><small>films / campaigns</small></span></button>
<button class="tile art" data-page="art"><img><span class="tileNo">02</span><span class="tileText"><b>ARTWORK</b><small>paint / mixed media</small></span></button>
<button class="tile food" data-page="food"><img><span class="tileNo">03</span><span class="tileText"><b>FOOD</b><small>cookbook / dishes</small></span></button>
<button class="tile thoughts" data-page="thoughts"><img><span class="tileNo">04</span><span class="tileText"><b>THOUGHTS</b><small>notes / fragments</small></span></button>
<button class="tile about" data-page="about"><img><span class="tileNo">05</span><span class="tileText"><b>ABOUT</b><small>visual bakbak</small></span></button>
<button class="tile now" data-page="now"><img><span class="tileNo">06</span><span class="tileText"><b>NOW</b><small>currently</small></span></button>
</section><footer>© VIZBAK · ALL RIGHTS RESERVED</footer></main>
<section id="panel"><div class="panelTop"><button id="back">← BACK</button><span id="panelNo">01</span><button id="close">CLOSE ×</button></div><div class="panelBody"><h1 id="title"></h1><div id="lead" class="lead"></div><div id="body"></div></div></section>
<div class="penrose" id="penrose"><span></span><span></span><span></span></div>
<script>
const data={
work:{n:'01',t:'WORK',l:'Commercials, brand films, music videos, documentaries and visual production.',html:'<div class="label">Selected work</div><div class="gallery"><figure><img src="assets/work.svg"><figcaption>FACeless / VISUAL PRODUCTION</figcaption></figure></div>'},
art:{n:'02',t:'ARTWORK',l:'Things I make when nobody asked me to make anything.',html:'<div class="label">Paint / textile / mixed media</div><div class="gallery">'+['01-canvas.jpg','02-red-canvas.jpg','03-vizbak-canvas.jpg','04-textile.jpg','05-portrait.jpg'].map((x,i)=>`<figure><img src="assets/artworks/${x}"><figcaption>WORK ${String(i+1).padStart(2,'0')} / ORIGINAL</figcaption></figure>`).join('')+'</div>'},
food:{n:'03',t:'FOOD',l:"Six things I made because apparently making films wasn't enough.",html:'<div class="label">Cookbook / 001—006</div><div class="gallery">'+['01-freshen-up.jpg','02-eat-your-greens.jpg','03-favourite-subject.jpg','04-tropical-tumbling.jpg','05-sweet-notes.jpg','06-cuffin.jpg'].map((x,i)=>`<figure><img src="assets/food/${x}"><figcaption>DISH ${String(i+1).padStart(2,'0')}</figcaption></figure>`).join('')+'</div>'},
thoughts:{n:'04',t:'THOUGHTS',l:'Notes, ideas, observations, film thoughts and half-formed things that deserve somewhere to exist.',html:'<div class="label">A living notebook</div><div class="gallery"><figure><img src="assets/artworks/04-textile.jpg"><figcaption>OBSERVATION</figcaption></figure><figure><img src="assets/artworks/01-canvas.jpg"><figcaption>FRAGMENT</figcaption></figure></div>'},
about:{n:'05',t:'ABOUT',l:'Anirudh Gupta, aka Visual Bakbak.',html:'<div class="label">A network of ideas</div><div class="neurons"><svg viewBox="0 0 400 500" preserveAspectRatio="none"><g stroke="rgba(185,146,74,.38)" fill="none" stroke-width="1"><path d="M60 90L160 160L205 250L110 330L65 430"/><path d="M340 80L250 150L205 250L290 330L340 430"/><path d="M160 160L250 150"/><path d="M110 330L290 330"/></g></svg><button class="node" style="left:15%;top:18%">curiosity</button><button class="node" style="left:40%;top:32%">visual</button><button class="node center" style="left:51%;top:50%">VIZBAK</button><button class="node" style="left:72%;top:30%">storytelling</button><button class="node" style="left:28%;top:66%">discipline</button><button class="node" style="left:73%;top:66%">expression</button><button class="node" style="left:51%;top:88%">purpose</button></div><div class="label">Contact</div><div class="contact"><a href="tel:+919310546065"><span>PHONE</span><span>+91 9310546065</span></a><a href="mailto:visualbakbak@gmail.com"><span>EMAIL</span><span>visualbakbak@gmail.com</span></a><a href="https://wa.me/919310546065"><span>WHATSAPP</span><span>CHAT</span></a></div>'},
now:{n:'06',t:'NOW',l:'Currently making things, building this archive and figuring out the next strange idea.',html:'<div class="label">Currently</div><div class="gallery"><figure><img src="assets/artworks/03-vizbak-canvas.jpg"><figcaption>IN PROGRESS</figcaption></figure><figure><img src="assets/food/05-sweet-notes.jpg"><figcaption>ALWAYS MAKING</figcaption></figure></div>'}};
const home=document.querySelector('#home'),site=document.querySelector('#site'),panel=document.querySelector('#panel'),pen=document.querySelector('#penrose');
document.querySelector('#enter').onclick=()=>{home.classList.add('hide');setTimeout(()=>site.classList.add('show'),350)};
function openPage(key){const d=data[key];document.querySelector('#panelNo').textContent=d.n;document.querySelector('#title').textContent=d.t;document.querySelector('#lead').textContent=d.l;document.querySelector('#body').innerHTML=d.html;panel.classList.add('open');document.body.style.overflow='hidden';document.querySelectorAll('.node').forEach(n=>n.onclick=()=>{document.querySelectorAll('.node').forEach(x=>x.classList.remove('active'));n.classList.add('active')})}
document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{pen.classList.remove('spin');void pen.offsetWidth;pen.classList.add('spin');openPage(t.dataset.page)});function closePage(){panel.classList.remove('open');document.body.style.overflow='auto'}document.querySelector('#back').onclick=closePage;document.querySelector('#close').onclick=closePage;
</script></body></html>
