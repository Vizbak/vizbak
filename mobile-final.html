<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>VIZBAK</title><style>:root{--bg:#050505;--fg:#f3f1ea;--gold:#b8944d;--dim:#777;--line:#b8944d66;--ease:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100svh;overflow-x:hidden}button,a{font:inherit;color:inherit}button{border:0;background:none}.home{display:grid;place-items:center;position:fixed;inset:0;background:var(--bg);z-index:10}.home button{font:900 19vw/.8 Arial,sans-serif;letter-spacing:-.08em}.home small{position:absolute;bottom:28px;font-size:8px;letter-spacing:.25em;text-transform:uppercase;color:var(--dim)}.hidden{display:none!important}.index{padding:18px 12px 30px}.bar{display:flex;justify-content:space-between;align-items:center;font-size:8px;letter-spacing:.2em;color:#aaa;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{position:relative;aspect-ratio:1/1.08;overflow:hidden;border:1px solid var(--line);background:#111;text-align:left;padding:0}.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0002,#000b)}.tile .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.48) saturate(.65);transition:transform .7s var(--ease)}.tile:active .bg{transform:scale(1.05)}.tile .copy{position:absolute;inset:0;z-index:2;padding:11px;display:flex;flex-direction:column;justify-content:space-between}.tile b{font:400 6px Arial;letter-spacing:.2em;color:#ccc}.tile h2{margin:0;font:400 clamp(20px,7vw,29px)/.85 Arial,sans-serif;letter-spacing:-.04em}.tile span{font-size:6px;letter-spacing:.14em;text-transform:uppercase;color:#aaa}.work .bg{background:radial-gradient(circle at 52% 35%,#555 0 8%,transparent 9%),linear-gradient(135deg,#111,#29 ><h2>NOW</h2><span>currently</span></div></button></div><div class="tap"></div></main><section id="page" class="page"><div class="pagebar"><span>VIZBAK / <b id="pn">01</b></span><button onclick="closePage()">CLOSE ×</button></div><div class="pagebody"><h1 id="pt">WORK</h1><div id="pb"></div></div></section><script>const data={work:['01','WORK',`<div class="lead">Commercials, brand films, music videos, documentaries and visual production.</div><div class="label">SELECTED WORK</div><div class="gallery"><article class="workitem"><span>01 / FEATURE FILM</span><h2>October</h2><p>Camera Trainee · Shoojit Sircar · 2018</p></article><article class="workitem"><span>02 / FEATURE DOCUMENTARY</span><h2>All That<br>Breathes</h2><p>VFX + Graphic Work · Shaunak Sen · 2022</p></article><article class="workitem"><span>03 / COMMERCIAL</span><h2>Acquaviva<br>Swim Spa</h2><p>Advertising film.</p></article><article class="workitem"><span>04 / MUSIC VIDEO</span><h2>Antriksh —<br>Sabki Kahani</h2><p>Music video.</p></article><article class="workitem"><span>05 / IMPACT DOCUMENTARY</span><h2>Fairtrade —<br>Rice Impact</h2><p>Documentary work.</p></article></div>`],art:['02','ARTWORK',`<div class="lead">Things I make when nobody asked me to make anything.</div><div class="label">PAINT / TEXTILE / MIXED MEDIA</div><div class="gallery">${['01-canvas.jpg','02-red-canvas.jpg','03-vizbak-canvas.jpg','04-textile.jpg','05-portrait.jpg'].map(x=>'<figure class="artwork"><img src="assets/artworks/'+x+'"></figure>').join('')}</div>`],food:['03','FOOD',`<div class="lead">Food photographed with the restraint and warmth of a good cookbook.</div><div class="label">COOKBOOK / 001—006</div><div class="gallery">${['01-freshen-up.jpg','02-eat-your-greens.jpg','03-favourite-subject.jpg','04-tropical-tumbling.jpg','05-sweet-notes.jpg','06-cuffin.jpg'].map(x=>'<figure><img src="assets/food/'+x+'"></figure>').join('')}</div>`],thoughts:['04','THOUGHTS',`<div class="lead">Notes, observations, film thoughts and half-formed ideas. A living notebook rather than a blog.</div><div class="label">FRAGMENTS</div>`],about:['05','ABOUT',`<div class="lead">A visual practice built from curiosity, experimentation and making things.</div><div class="label">CONNECTED IDEAS</div><div class="network"><svg viewBox="0 0 400 520" preserveAspectRatio="none"><g stroke="#b8944d88" fill="none" stroke-width="1"><path d="M200 260L92 105L310 85M200 260L70 285L315 300M200 260L120 430L300 440M92 105L310 85M70 285L120 430M315 300L300 440"/></g></svg><div class="node center" style="left:50%;top:50%" onclick="activate(this)">VIZBAK</div><div class="node" style="left:23%;top:20%" onclick="activate(this)">VISION</div><div class="node" style="left:78%;top:16%" onclick="activate(this)">CREATIVITY</div><div class="node" style="left:18%;top:55%" onclick="activate(this)">EXPLORATION</div><div class="node" style="left:79%;top:58%" onclick="activate(this)">EXPRESSION</div><div class="node" style="left:30%;top:83%" onclick="activate(this)">DISCIPLINE</div><div class="node" style="left:75%;top:84%" onclick="activate(this)">EXPERIMENT</div></div><div class="contact"><a href="tel:+919310546065"><small>PHONE</small>+91 9310546065</a><a href="mailto:visualbakbak@gmail.com"><small>EMAIL</small>visualbakbak@gmail.com</a><a href="https://wa.me/919310546065"><small>WHATSAPP</small>Chat on WhatsApp</a></div>`],now:['06','NOW',`<div class="lead">Currently making things, building the archive and figuring out the next strange idea.</div><div class="label">CURRENTLY</div>`]};function openPage(k){const d=data[k];pn.textContent=d[0];pt.textContent=d[1];pb.innerHTML=d[2];index.classList.add('hidden');page.classList.add('show');window.scrollTo(0,0)}function closePage(){page.classList.remove('show');index.classList.remove('hidden')}function goHome(){index.classList.add('hidden');home.classList.remove('hidden')}enter.onclick=()=>{home.classList.add('hidden');index.classList.remove('hidden')};function activate(el){document.querySelectorA
